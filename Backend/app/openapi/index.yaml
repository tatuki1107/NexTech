      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 3000
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        contactEmail:
          type: string
          format: email
