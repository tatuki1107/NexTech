        - title
        - description
        - categoryId
        - format
        - startAt
        - endAt
        - capacity
        - waitlistEnabled
        - applicationDeadline
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          minLength: 1
        categoryId:
          type: string
          format: uuid
        tagIds:
          type: array
          maxItems: 30
          items:
