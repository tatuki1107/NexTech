openapi: 3.0.3
info:
  title: NexTech API
  version: 1.3.0
  description: "エンジニア向け勉強会・イベントマッチングサービス「NexTech」のMVP向けAPI仕様。\nイベント検索、参加申込、キャンセル待ち、主催者運営、管理者集計を対象とする。\n"
servers:
  - url: https://api.example.com/api/v1
    description: Production placeholder
  - url: http://localhost:3001/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 認証
  - name: Me
    description: ログインユーザー
  - name: Events
    description: イベント検索・詳細・申込
  - name: Organizers
    description: 主催者管理
  - name: Admin
    description: 管理者機能
paths:
  /me/saved-events:
    get:
      tags:
        - Me
      summary: 保存したイベント一覧
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: view
          in: query
          schema:
            type: string
            enum:
              - upcoming
              - past
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEventsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  "/me/saved-events/{eventId}":
    put:
      tags:
        - Me
      summary: イベントを保存
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: 成功（再実行可能）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "404":
          $ref: "#/components/responses/NotFoundError"
      description: 公開済み・アクセス可能なイベントのみ保存可能。重複保存は204。保存自体は非公開イベントの閲覧権限を付与しない。
    delete:
      tags:
        - Me
      summary: 保存を解除
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: 成功（再実行可能）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /me/favorite-categories:
    get:
      tags:
        - Me
      summary: フォロー中のカテゴリ一覧
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteCategoriesResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /me/favorite-organizers:
    get:
      tags:
        - Me
      summary: フォロー中の主催者一覧
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteOrganizersResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /me/organizers:
    get:
      tags:
        - Me
      summary: 自分が所有または所属する主催者一覧
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyOrganizersResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /me/notification-settings:
    get:
      tags:
        - Me
      summary: 通知設定取得
      description: 未保存時は申込通知・リマインドON、おすすめOFF。アプリ内通知に適用する。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
    patch:
      tags:
        - Me
      summary: 通知設定を部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /me/notifications:
    get:
      tags:
        - Me
      summary: 自分の通知一覧
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /me/notifications/read-all:
    put:
      tags:
        - Me
      summary: 自分の通知をすべて既読にする
      parameters: []
      responses:
        "204":
          description: 成功（再実行可能）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  "/me/notifications/{notificationId}/read":
    put:
      tags:
        - Me
      summary: 自分の通知を既読にする
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 成功（再実行可能）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /auth/signup:
    post:
      tags:
        - Auth
      summary: ユーザー登録
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /auth/login:
    post:
      tags:
        - Auth
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: アクセストークン更新
      description: HttpOnly Cookieの更新トークンをローテーションし、新しいアクセストークンを返す。
      security:
        - refreshCookie: []
      responses:
        "200":
          description: 更新成功。新しい更新トークンをSet-Cookieで返す。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: ログアウト
      description: 現在の更新トークンを失効し、Cookieを削除する。
      security: []
      responses:
        "204":
          description: ログアウト成功
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /me:
    get:
      tags:
        - Me
      summary: 自分のユーザー情報取得
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
    patch:
      tags:
        - Me
      summary: 自分のプロフィール更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
  /me/registrations:
    get:
      tags:
        - Me
      summary: 自分の申込一覧取得
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum:
              - upcoming
              - past
              - waitlisted
              - cancelled
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Registration"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  "/me/favorite-organizers/{organizerId}":
    put:
      tags:
        - Me
      summary: 主催者を興味登録
      parameters:
        - $ref: "#/components/parameters/OrganizerId"
      responses:
        "204":
          description: 登録成功
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
        - Me
      summary: 主催者の興味登録解除
      parameters:
        - $ref: "#/components/parameters/OrganizerId"
      responses:
        "204":
          description: 解除成功
  "/me/favorite-categories/{categoryId}":
    put:
      tags:
        - Me
      summary: カテゴリを興味登録
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: 登録成功
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
        - Me
      summary: カテゴリの興味登録解除
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: 解除成功
  /categories:
    get:
      tags:
        - Events
      summary: カテゴリ一覧取得
      security: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
  /tags:
    get:
      tags:
        - Events
      summary: タグ検索
      security: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
  /events:
    get:
      tags:
        - Events
      summary: 公開イベント検索
      description: 有効な主催者の公開イベントを東京時間の開催日で検索する。keywordはイベント名・概要・主催者名の部分一致。%と_は文字として扱う。範囲外ページでも総件数を維持する。
      security: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 200
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/CategoryIdQuery"
        - name: tagIds
          in: query
          description: カンマ区切りのUUID。いずれかのタグに一致するイベントを取得する。
          schema:
            type: string
        - name: organizerId
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            $ref: "#/components/schemas/EventFormat"
        - name: hasCapacity
          in: query
          description: trueは空席あり、falseは満席のイベントだけを返す。
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: organizerName
          in: query
          schema:
            type: string
            maxLength: 100
          description: 主催者名の部分一致
      responses:
        "200":
          description: 検索成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventListItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  "/events/{eventId}":
    get:
      tags:
        - Events
      summary: イベント詳細取得
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags:
        - Organizers
      summary: イベント編集
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdateRequest"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: 読み込んだ版が古い（VERSION_CONFLICT）。再取得してから再編集する。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  "/events/{eventId}/registrations":
    post:
      tags:
        - Events
      summary: イベント申込
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationApplyRequest"
      responses:
        "201":
          description: 申込成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationApplyResponse"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "410":
          description: 申込期間外
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Organizers
      summary: 参加者一覧取得
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RegistrationStatus"
        - name: keyword
          in: query
          description: 氏名・メール・申込番号の部分一致
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: registrationId
          in: query
          schema:
            type: string
            format: uuid
          description: 申込番号（UUID）の完全一致
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Registration"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  "/events/{eventId}/registration":
    delete:
      tags:
        - Events
      summary: 自分の申込キャンセル
      description: 開始前の申込のみキャンセル可能。中止・下書き状態・主催者停止中でもキャンセルできるが、待機者の繰り上げは行わない。開催済み・受付済みは422。
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: キャンセル成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Registration"
        "404":
          "422":
            $ref: "#/components/responses/BusinessRuleError"
          $ref: "#/components/responses/NotFoundError"
  "/events/{eventId}/recruitment-summary":
    get:
      tags:
        - Organizers
      summary: 募集状況取得
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RecruitmentSummary"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  "/events/{eventId}/registrations/{registrationId}/check-in":
    delete:
      tags:
        - Organizers
      summary: 当日受付の取消
      description: 有効な主催者の公開中イベントのみ操作可能。受付済みを参加確定に戻し、受付日時・メモを消去して履歴を保存する。参加枠は維持する。受付済み以外は422。
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: 受付取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
    post:
      tags:
        - Organizers
      summary: 当日受付
      description: 有効な主催者の公開中イベントで、参加確定済みの申込のみ受付できる。イベント行をロックし、中止処理との競合を防ぐ。
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "200":
          description: 受付成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Registration"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /organizers:
    post:
      tags:
        - Organizers
      summary: 主催者情報作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizerCreateRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organizer"
        "400":
          $ref: "#/components/responses/ValidationError"
  "/organizers/{organizerId}":
    get:
      tags:
        - Organizers
      summary: 主催者詳細取得
      security: []
      parameters:
        - $ref: "#/components/parameters/OrganizerId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organizer"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags:
        - Organizers
      summary: 主催者情報更新
      parameters:
        - $ref: "#/components/parameters/OrganizerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizerUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organizer"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  "/organizers/{organizerId}/events":
    get:
      tags:
        - Organizers
      summary: 主催者のイベント一覧
      parameters:
        - $ref: "#/components/parameters/OrganizerId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventListItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
    post:
      tags:
        - Organizers
      summary: イベント作成
      parameters:
        - $ref: "#/components/parameters/OrganizerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /admin/events:
    get:
      tags:
        - Admin
      summary: 管理者向けイベント一覧
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EventStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 200
        - name: organizerId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: 東京時間の開催日・開始
        - name: to
          in: query
          schema:
            type: string
            format: date
