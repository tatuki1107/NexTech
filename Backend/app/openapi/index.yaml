      description: 東京時間の開催日で集計し、published/completedのみを対象にする。期間は最大3660日。registrationCountはキャンセル以外（待機含む）、confirmedCountは枠使用状態、attendedCountはchecked_in。applicationRateはregistrationCount/定員合計で、待機を含むため1を超える場合がある。 groupBy必須。対応するcategoryId/organizerId/formatを追加する。
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: organizerId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            $ref: "#/components/schemas/EventFormat"
        - name: metric
          in: query
          schema:
            type: string
            enum:
              - events
              - registrations
              - participants
              - attendance
              - applicationRate
            default: events
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: groupBy
          in: query
          schema:
            type: string
            enum:
              - category
              - organizer
              - format
          required: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/AnalyticsGroup"
                        - type: object
                          properties:
                            categoryId:
                              type: string
                              format: uuid
                            categoryName:
                              type: string
                            organizerId:
                              type: string
                              format: uuid
                            organizerName:
                              type: string
                            format:
                              $ref: "#/components/schemas/EventFormat"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: nextechRefreshToken
      description: HttpOnly、SameSite=Lax、Path=/api/v1/auth。30日で失効し、更新時にローテーションする。
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizerId:
      name: organizerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryIdQuery:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
  responses:
    ValidationError:
      description: 入力値不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthRequiredError:
      description: 認証が必要
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: 権限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: 重複または状態競合
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BusinessRuleError:
      description: 業務ルール違反
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - displayName
        - roles
        - status
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        fullName:
          type: string
          nullable: true
        profileText:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
              - participant
              - organizer
              - admin
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
    SignupRequest:
      type: object
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 200
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        fullName:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
    AuthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accessToken
            - user
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 900
            user:
              $ref: "#/components/schemas/User"
    ProfileUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        fullName:
          type: string
          maxLength: 100
          nullable: true
        profileText:
          type: string
          maxLength: 2000
          nullable: true
        avatarUrl:
          type: string
          format: uri
          maxLength: 2000
          nullable: true
    Organizer:
      type: object
      required:
        - id
        - name
        - slug
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
    OrganizerCreateRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 3000
        websiteUrl:
          type: string
          format: uri
        contactEmail:
          type: string
          format: email
    OrganizerUpdateRequest:
      type: object
      description: PATCH用の部分更新。指定された項目のみ更新し、説明・URL・連絡先はnullで解除できる。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 3000
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
    Category:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Tag:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    EventFormat:
      type: string
      enum:
        - online
        - offline
        - hybrid
    EventStatus:
      type: string
      enum:
        - draft
        - published
        - cancelled
        - completed
    EventListItem:
      type: object
      description: 主催者・管理者が取得する未完成の下書きではformat・startAt・endAt・capacity・categoryがnullになる。公開イベントでは入力済み。
      required:
        - id
        - title
        - format
        - startAt
        - endAt
        - capacity
        - confirmedCount
        - waitlistCount
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
          nullable: true
        format:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EventFormat"
        venueName:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        endAt:
          type: string
          format: date-time
          nullable: true
        category:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Category"
        organizer:
          $ref: "#/components/schemas/Organizer"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        capacity:
          type: integer
          nullable: true
        confirmedCount:
          type: integer
        waitlistCount:
          type: integer
        registrationStatus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegistrationStatus"
    Event:
      allOf:
        - $ref: "#/components/schemas/EventListItem"
        - type: object
          required:
            - description
            - status
            - waitlistEnabled
            - applicationDeadline
            - version
          properties:
            description:
              type: string
            participationConditions:
              type: string
              nullable: true
              maxLength: 10000
            address:
              type: string
              nullable: true
            onlineUrl:
              type: string
              nullable: true
              description: 参加確定者、主催者、管理者に限定して返却する
            status:
              $ref: "#/components/schemas/EventStatus"
            waitlistEnabled:
              type: boolean
            applicationStartAt:
              type: string
              format: date-time
              nullable: true
            applicationDeadline:
              type: string
              format: date-time
              nullable: true
            publishedAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            version:
              type: integer
              minimum: 1
    EventCreateRequest:
      type: object
      description: 下書きを作成する。タイトルだけで保存可能。未指定の説明は空文字、日時・カテゴリ・形式・定員はnull、待機受付はfalse。公開時に説明・カテゴリ・形式・日時・定員・開催場所を検証する。締切なしの公開も可能。
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          minLength: 1
        participationConditions:
          type: string
          nullable: true
          maxLength: 10000
        categoryId:
          type: string
          format: uuid
        tagIds:
          type: array
          maxItems: 30
          items:
            type: string
            format: uuid
        format:
          $ref: "#/components/schemas/EventFormat"
        venueName:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 1000
        onlineUrl:
          type: string
          format: uri
          maxLength: 2000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        waitlistEnabled:
          type: boolean
        applicationStartAt:
          type: string
          format: date-time
        applicationDeadline:
          type: string
          format: date-time
    EventUpdateRequest:
      type: object
      description: 部分更新。取得済みEvent.versionをexpectedVersionとして必須指定する。不一致は409 VERSION_CONFLICT。増員時は既存の待機者から繰り上げる。
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          minLength: 1
        participationConditions:
          type: string
          nullable: true
          maxLength: 10000
        categoryId:
          type: string
          format: uuid
        tagIds:
          type: array
          maxItems: 30
          items:
            type: string
            format: uuid
        format:
          $ref: "#/components/schemas/EventFormat"
        venueName:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 1000
        onlineUrl:
          type: string
          format: uri
          maxLength: 2000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        waitlistEnabled:
          type: boolean
        applicationStartAt:
          type: string
          format: date-time
        applicationDeadline:
          type: string
          format: date-time
    RegistrationStatus:
      type: string
      enum:
        - pending
        - confirmed
        - waitlisted
        - cancelled
        - checked_in
        - no_show
    Registration:
      type: object
      required:
        - id
        - eventId
        - userId
        - status
        - appliedAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        event:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EventListItem"
        user:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/User"
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        waitlistPosition:
          type: integer
          nullable: true
          description: 現在の待機者の中での順位（1始まり）。内部の並び順キーではない。
        appliedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
    RegistrationApplyRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 255
    RegistrationApplyResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - registrationId
            - eventId
            - status
            - message
          properties:
            registrationId:
              type: string
              format: uuid
            eventId:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/RegistrationStatus"
            waitlistPosition:
              type: integer
              nullable: true
              description: 現在のキャンセル待ち順位（1始まり）。
            message:
              type: string
    CheckInRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 255
    RecruitmentSummary:
      type: object
      required:
        - eventId
        - capacity
        - confirmedCount
        - waitlistCount
        - cancelledCount
        - attendedCount
        - availableSeats
      properties:
        eventId:
          type: string
          format: uuid
        capacity:
          type: integer
        confirmedCount:
          type: integer
        waitlistCount:
          type: integer
        cancelledCount:
          type: integer
        attendedCount:
          type: integer
        availableSeats:
          type: integer
    MonthlyEventMetric:
      type: object
      required:
        - month
        - eventCount
      properties:
        month:
          type: string
          example: "2026-08"
        eventCount:
          type: integer
    PopularCategoryMetric:
      type: object
      required:
        - categoryId
        - categoryName
        - eventCount
        - registrationCount
        - attendedCount
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        eventCount:
          type: integer
        registrationCount:
          type: integer
        attendedCount:
          type: integer
    Pagination:
      type: object
      required:
        - page
        - perPage
        - total
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    SavedEvent:
      allOf:
        - $ref: "#/components/schemas/EventListItem"
        - type: object
          required:
            - savedAt
          properties:
            savedAt:
              type: string
              format: date-time
    SavedEventsResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SavedEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"
    FavoriteCategory:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - followedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        followedAt:
          type: string
          format: date-time
    FavoriteCategoriesResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteCategory"
        pagination:
          $ref: "#/components/schemas/Pagination"
    FavoriteOrganizer:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - websiteUrl
        - status
        - followedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        status:
          type: string
        followedAt:
          type: string
          format: date-time
    FavoriteOrganizersResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteOrganizer"
        pagination:
          $ref: "#/components/schemas/Pagination"
    MyOrganizer:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - status
        - memberRole
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        memberRole:
          type: string
          enum:
            - owner
            - admin
            - member
    MyOrganizersResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MyOrganizer"
        pagination:
          $ref: "#/components/schemas/Pagination"
    NotificationSettings:
      type: object
      required:
        - registrationUpdates
        - eventReminders
        - recommendations
      properties:
        registrationUpdates:
          type: boolean
          default: true
        eventReminders:
          type: boolean
          default: true
        recommendations:
          type: boolean
          default: false
    NotificationSettingsUpdate:
      type: object
      required: []
      properties:
        registrationUpdates:
          type: boolean
          default: true
        eventReminders:
          type: boolean
          default: true
        recommendations:
          type: boolean
          default: false
    Notification:
      type: object
      required:
        - id
        - eventId
        - kind
        - title
        - message
        - readAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
            - registration
            - reminder
            - recommendation
        title:
          type: string
        message:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    NotificationsResponse:
      type: object
      required:
        - data
        - pagination
        - unreadCount
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        pagination:
          $ref: "#/components/schemas/Pagination"
        unreadCount:
          type: integer
          minimum: 0
    RecommendedEvent:
      allOf:
        - $ref: "#/components/schemas/EventListItem"
        - type: object
          required:
            - sameOrganizer
            - sharedTags
          properties:
            sameOrganizer:
              type: boolean
            sharedTags:
              type: boolean
    AdminOrganizer:
      type: object
      required:
        - id
        - ownerUserId
        - name
        - slug
        - description
        - websiteUrl
        - contactEmail
        - status
        - createdAt
        - updatedAt
        - reviewedAt
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    AdminRegistration:
      type: object
      required:
        - id
        - eventId
        - userId
        - status
        - waitlistPosition
        - appliedAt
        - confirmedAt
        - cancelledAt
        - checkedInAt
        - updatedAt
        - user
        - event
        - reviewedAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        waitlistPosition:
          type: integer
          nullable: true
          minimum: 1
        appliedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          required:
            - id
            - email
            - displayName
            - fullName
