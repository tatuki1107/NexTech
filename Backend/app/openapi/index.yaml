                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部情報を含まないサーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/notification-settings:
    get:
      tags:
        - Me
      summary: 通知設定取得
      description: 未保存時は申込通知・リマインドON、おすすめOFF。アプリ内通知に適用する。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
