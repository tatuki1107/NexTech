  /auth/refresh:
    post:
      tags:
        - Auth
      summary: アクセストークン更新
      description: HttpOnly Cookieの更新トークンをローテーションし、新しいアクセストークンを返す。
      security:
        - refreshCookie:
            []
      responses:
        "200":
          description: 更新成功。新しい更新トークンをSet-Cookieで返す。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
