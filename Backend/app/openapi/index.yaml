          $ref: "#/components/schemas/Organizer"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        capacity:
          type: integer
        confirmedCount:
          type: integer
        waitlistCount:
          type: integer
        registrationStatus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegistrationStatus"
    Event:
      allOf:
        - $ref: "#/components/schemas/EventListItem"
        - type: object
          required:
            - description
            - status
            - waitlistEnabled
            - applicationDeadline
          properties:
            description:
              type: string
            address:
              type: string
              nullable: true
            onlineUrl:
              type: string
              nullable: true
              description: 参加確定者、主催者、管理者に限定して返却する
            status:
              $ref: "#/components/schemas/EventStatus"
            waitlistEnabled:
              type: boolean
            applicationStartAt:
              type: string
              format: date-time
              nullable: true
            applicationDeadline:
              type: string
              format: date-time
              nullable: true
            publishedAt:
              type: string
              format: date-time
              nullable: true
            participationRequirements:
              type: string
              maxLength: 3000
              nullable: true
            moderationBlocked:
              type: boolean
              description: 管理者の公開停止。管理者のみ解除可能。
