openapi: 3.0.3
info:
  title: NexTech API
  version: 1.3.0
  description: "エンジニア向け勉強会・イベントマッチングサービス「NexTech」のMVP向けAPI仕様。\nイベント検索、参加申込、キャンセル待ち、主催者運営、管理者集計を対象とする。\n"
servers:
  - url: https://api.example.com/api/v1
    description: Production placeholder
  - url: http://localhost:3001/api/v1
    description: Local development
security:
  - bearerAuth:
      []
tags:
  - name: Auth
    description: 認証
  - name: Me
    description: ログインユーザー
  - name: Events
    description: イベント検索・詳細・申込
  - name: Organizers
    description: 主催者管理
  - name: Admin
    description: 管理者機能
paths:
  /me/saved-events:
    get:
      tags:
        - Me
      summary: 保存したイベント一覧
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: view
          in: query
          schema:
            type: string
            enum:
              - upcoming
              - past
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEventsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
        "429":
          description: リクエスト上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部情報を含まないサーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/me/saved-events/{eventId}":
    put:
      tags:
        - Me
      summary: イベントを保存
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: 成功（再実行可能）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
        "429":
          description: リクエスト上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部情報を含まないサーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: 公開済み・アクセス可能なイベントのみ保存可能。重複保存は204。保存自体は非公開イベントの閲覧権限を付与しない。
    delete:
      tags:
        - Me
      summary: 保存を解除
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: 成功（再実行可能）
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequiredError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
        "429":
          description: リクエスト上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部情報を含まないサーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/favorite-categories:
    get:
