services:
  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./Backend/app
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://nextech:nextech@database:5432/nextech
      JWT_SECRET: docker-development-secret-at-least-32-characters
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextech
      POSTGRES_USER: nextech
      POSTGRES_PASSWORD: nextech
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextech -d nextech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
