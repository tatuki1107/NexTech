services:
  backend:
    build:
      context: ./Backend/app
      dockerfile: Dockerfile
      target: development
    command: bun run dev
    ports:
      - "3001:3001"
    volumes:
      - ./Backend/app:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - "fetch('http://localhost:3001/api').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: development
    command: bun run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
