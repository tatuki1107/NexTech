services:
  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./Backend/app
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://nextech:nextech_dev_password@db:5432/nextech
    volumes:
      - ./Backend/app:/app
      - backend_node_modules:/app/node_modules

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextech
      POSTGRES_USER: nextech
      POSTGRES_PASSWORD: nextech_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_node_modules: